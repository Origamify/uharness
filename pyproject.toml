[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "uharness"
version = "1.0.0"
description = "Minimal agent harness: prompt in, tool-calling loop, result dict out."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["uharness"]
